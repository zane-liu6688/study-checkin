<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 周打卡台 · 每日课程表</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --line: #e4e6eb; --text: #1c1e21; --sub: #6b7280;
    --main: #4f46e5; --main-soft: #eef2ff; --ok: #16a34a; --ok-soft: #dcfce7;
    --warn: #d97706; --warn-soft: #fef3c7;
    --tech: #4f46e5; --eng: #0891b2; --flute: #db2777; --gym: #ea580c; --meal: #16a34a; --rest: #7c3aed; --plan: #64748b;
  }
  [data-theme="dark"] {
    --bg: #18191c; --card: #24262b; --line: #3a3d44; --text: #f3f4f6; --sub: #9ca3af;
    --main: #818cf8; --main-soft: #2e3150; --ok: #4ade80; --ok-soft: #14532d;
    --warn: #fbbf24; --warn-soft: #451a03;
    --tech: #818cf8; --eng: #22d3ee; --flute: #f472b6; --gym: #fb923c; --meal: #4ade80; --rest: #a78bfa; --plan: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 14px; line-height: 1.55; transition: background .2s; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 20px; font-weight: 700; }
  h1 small { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 8px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--main); color: var(--main); }
  button.primary { background: var(--main); border-color: var(--main); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .lab { font-size: 12px; color: var(--sub); }
  .stat.fire .num { color: var(--warn); }
  .stat.total .num { color: var(--main); }
  .stat.tech .num { color: var(--tech); }
  .stat.eng .num { color: var(--eng); }
  .bar-row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .bar-row .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--main), var(--eng)); border-radius: 99px; transition: width .3s; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .day-head .d { font-size: 17px; font-weight: 700; }
  .day-head .meta { font-size: 12px; color: var(--sub); }
  .exam { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 12px; font-size: 13px; margin: 8px 0; font-weight: 600; }
  .weekinfo { background: var(--main-soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--sub); margin: 8px 0; }
  .weekinfo b { color: var(--text); }
  .wt-card { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 12.5px; }
  .wt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-weight: 700; color: var(--warn); margin-bottom: 4px; }
  .wt-head .cnt { font-size: 11px; font-weight: 400; color: var(--sub); }
  .wt-body { color: var(--text); line-height: 1.6; }
  .wt-btns { display: flex; gap: 6px; margin-top: 8px; }
  .wt-btns button { font-size: 12px; padding: 4px 10px; border-radius: 99px; }
  .wt-btns button.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
  .task:last-child { border-bottom: none; }
  .task .cb { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px; flex: none; cursor: pointer; margin-top: 2px; display: flex; align-items: center; justify-content: center; background: var(--card); transition: all .15s; }
  .task .cb:hover { border-color: var(--main); }
  .task .cb.on { background: var(--ok); border-color: var(--ok); color: #fff; font-size: 13px; font-weight: 700; }
  .task .body { flex: 1; min-width: 0; }
  .task .t-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task .tm { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; flex: none; }
  .task .nm { font-size: 13.5px; }
  .task.done .nm { color: var(--sub); text-decoration: line-through; }
  .task .cat { font-size: 11px; padding: 1px 8px; border-radius: 99px; color: #fff; flex: none; }
  .cat.tech { background: var(--tech); } .cat.eng { background: var(--eng); }
  .cat.flute { background: var(--flute); } .cat.gym { background: var(--gym); }
  .cat.meal { background: var(--meal); } .cat.rest { background: var(--rest); } .cat.plan { background: var(--plan); }
  .task.info { opacity: .55; }
  .task.info .nm { font-size: 12.5px; color: var(--sub); }
  .today-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .today-sum b { color: var(--text); }
  .line-box { background: var(--ok-soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-top: 10px; }
  .line-box b { color: var(--ok); }
  .cal-head { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .cal-head span { font-size: 11px; color: var(--sub); font-weight: 400; }
  .cal { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font-size: 10.5px; color: var(--sub); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .cell:hover { border-color: var(--main); }
  .cell.part { background: var(--main-soft); color: var(--main); }
  .cell.done { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
  .cell.today { outline: 2px solid var(--main); outline-offset: 1px; }
  .cell.sel { border: 2px solid var(--main); font-weight: 700; color: var(--text); }
  .cell .st { position: absolute; top: -3px; right: -1px; font-size: 8px; color: var(--warn); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--sub); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9; }
  .planver { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--sub); margin-bottom: 12px; }
  .planver .pv-tag { background: var(--main); color: #fff; border-radius: 99px; padding: 1px 10px; font-weight: 700; font-size: 11.5px; }
  .planver .pv-tip { margin-left: auto; color: var(--warn); }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>15 周打卡台<small>每日课程表 · 2026.11.2 - 2027.2.13</small></h1>
    <div class="btns">
      <button id="btnTheme">🌓 深浅切换</button>
      <button id="btnCopy">📋 复制今日记录</button>
      <button id="btnExport">⬇ 导出备份</button>
      <button id="btnImport">⬆ 导入备份</button>
      <input type="file" id="fileImp" accept=".json" style="display:none">
    </div>
  </header>

  <div class="stats">
    <div class="stat fire"><div class="num" id="stStreak">0</div><div class="lab">🔥 连续全勾天数</div></div>
    <div class="stat total"><div class="num" id="stTotal">0/81</div><div class="lab">✅ 已完成天数</div></div>
    <div class="stat tech"><div class="num" id="stTech">0h</div><div class="lab">💻 累计技术时长</div></div>
    <div class="stat eng"><div class="num" id="stEng">0h</div><div class="lab">📖 累计英语时长</div></div>
  </div>

  <div class="bar-row">
    <div class="t"><span id="barLab">第 1 天 / 共 81 天</span><span id="barLeft"></span></div>
    <div class="bar"><div id="barFill" style="width:0%"></div></div>
  </div>

  <div class="planver">
    <span class="pv-tag">计划 <span id="pvTag">v?</span></span>
    <span id="pvAt"></span>
    <span id="pvNote"></span>
    <span class="pv-tip">要调整计划（生病/落后/想休息）→ 去日记窗口找规划师，它改完后版本号 +1</span>
  </div>

  <div class="layout">
    <div class="card" id="dayCard"></div>
    <div class="card">
      <div class="cal-head">81 天日历墙<span>点格子可切到/补卡任意一天</span></div>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>全勾</span>
        <span><i style="background:var(--main-soft)"></i>部分</span>
        <span><i style="background:var(--bg);border:1px solid var(--line)"></i>未开始</span>
        <span><i style="background:var(--warn)"></i>⭐考试/验收</span>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

var PLAN_VERSION = {"v": 4, "at": "2026-11-01", "note": "11/2开工 · 12周扩为15周 · 春招早鸟版（含W13-15强化/包装/投递）"};
var KEY = "wb_12w_checkin_v2";
var CAT_NAME = {tech:"技术", eng:"英语", flute:"笛子", gym:"健身", meal:"三餐", rest:"休息", plan:"规划"};

function pad(n){ return (n<10?"0":"")+n; }
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dateOf(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function dayIdx(k){ var s = dateOf(SCHEDULE[0].date); return Math.round((dateOf(k) - s) / 86400000); }
function todayKey(){
  var t = key(new Date());
  if (dateOf(t) < dateOf(SCHEDULE[0].date)) return SCHEDULE[0].date;
  if (dateOf(t) > dateOf(SCHEDULE[SCHEDULE.length-1].date)) return SCHEDULE[SCHEDULE.length-1].date;
  return t;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(m){ var h = Math.floor(m/60), mm = m%60; return h ? (h+" 小时 "+(mm?mm+" 分":"")) : (mm+" 分钟"); }

function load(){
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (!d.done) d.done = {};
    return d;
  } catch(e){ return {done:{}}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }
var data = load();
var selKey = todayKey();

function isDone(k, i){ return !!(data.done[k] && data.done[k][i]); }
function wtResult(w){ return (data.wt && data.wt[w]) || "todo"; }
function setWt(w, r){ if (!data.wt) data.wt = {}; data.wt[w] = r; save(); render(); }
function wtPassed(){ var n = 0, seen = {}; for (var i = 0; i < SCHEDULE.length; i++) { var w = SCHEDULE[i].week; if (!seen[w]) { seen[w] = 1; if (wtResult(w) === "pass") n++; } } return n; }
function wtWeeks(){ var s = {}; for (var i = 0; i < SCHEDULE.length; i++) s[SCHEDULE[i].week] = 1; return Object.keys(s).length; }
function toggle(k, i){
  if (!data.done[k]) data.done[k] = {};
  if (data.done[k][i]) delete data.done[k][i]; else data.done[k][i] = 1;
  if (!Object.keys(data.done[k]).length) delete data.done[k];
  save(); render();
}
function checkables(d){ return d.rows.filter(function(r){ return r.cat !== "info"; }); }
function dayStat(k){
  var d = byKey(k); if (!d) return {done:0, total:0, full:false};
  var cs = checkables(d), n = 0;
  for (var i = 0; i < cs.length; i++) if (isDone(k, d.rows.indexOf(cs[i]))) n++;
  return {done:n, total:cs.length, full: n === cs.length && cs.length > 0};
}
function byKey(k){ for (var i = 0; i < SCHEDULE.length; i++) if (SCHEDULE[i].date === k) return SCHEDULE[i]; return null; }

function computeStats(){
  var streak = 0, total = 0, tech = 0, eng = 0;
  var i = SCHEDULE.length - 1;
  // 连续：从今天（或昨天）往前数
  var startIdx = dayIdx(todayKey());
  var began = false;
  for (var j = startIdx; j >= 0; j--) {
    var st = dayStat(SCHEDULE[j].date);
    if (st.full) { streak++; began = true; }
    else if (!began && j === startIdx) { continue; } // 今天还没打完，不断档
    else break;
  }
  for (var j2 = 0; j2 < SCHEDULE.length; j2++) {
    var d = SCHEDULE[j2], st2 = dayStat(d.date);
    if (st2.full) total++;
    for (var r = 0; r < d.rows.length; r++) {
      if (!isDone(d.date, r)) continue;
      if (d.rows[r].cat === "tech") tech += d.rows[r].min || 0;
      if (d.rows[r].cat === "eng") eng += d.rows[r].min || 0;
    }
  }
  return {streak: streak, total: total, tech: tech, eng: eng};
}

function renderDay(){
  var d = byKey(selKey);
  var el = document.getElementById("dayCard");
  var st = dayStat(selKey);
  var html = "";
  html += '<div class="day-head"><span class="d">' + esc(d.label) + '</span><span class="meta">' + esc(d.week) + ' · 完成 ' + st.done + '/' + st.total + '</span></div>';
  if (d.exam) html += '<div class="exam">⭐ 今天是考试/验收日——按表执行，别糊弄</div>';
  if (d.goal) html += '<div class="weekinfo"><b>本周目标：</b>' + esc(d.goal) + (d.check ? '<br><b>周验收：</b>' + esc(d.check) : '') + '</div>';
  if (d.wt) {
    var wr = wtResult(d.week);
    var wrTxt = wr === "pass" ? "已过 ✅" : (wr === "fail" ? "补考 🔁" : "待测");
    html += '<div class="wt-card"><div class="wt-head"><span>📝 本周测试（周日晚做 · 日记窗口出题判分）</span><span class="cnt">' + esc(d.week) + ' · 全期已过 ' + wtPassed() + '/' + wtWeeks() + ' · 本周：' + wrTxt + '</span></div>'
      + '<div class="wt-body">' + esc(d.wt) + '</div>'
      + '<div class="wt-btns">'
      + '<button data-wt="todo" class="' + (wr === "todo" ? "on" : "") + '">待测</button>'
      + '<button data-wt="pass" class="' + (wr === "pass" ? "on" : "") + '">过了 ✅</button>'
      + '<button data-wt="fail" class="' + (wr === "fail" ? "on" : "") + '">补考 🔁</button>'
      + '</div></div>';
  }
  for (var i = 0; i < d.rows.length; i++) {
    var r = d.rows[i], on = isDone(selKey, i);
    if (r.cat === "info") {
      html += '<div class="task info"><div class="body"><div class="t-line"><span class="tm">' + esc(r.t) + '</span><span class="nm">' + esc(r.name) + '</span></div></div></div>';
      continue;
    }
    html += '<div class="task' + (on ? " done" : "") + '" data-i="' + i + '">'
      + '<div class="cb' + (on ? " on" : "") + '">' + (on ? "✓" : "") + '</div>'
      + '<div class="body"><div class="t-line"><span class="tm">' + esc(r.t) + '</span>'
      + '<span class="cat ' + r.cat + '">' + CAT_NAME[r.cat] + '</span>'
      + '<span class="nm">' + esc(r.name) + '</span>'
      + (r.min ? '<span class="tm">' + fmt(r.min) + '</span>' : '')
      + '</div></div></div>';
  }
  var techMin = 0, engMin = 0, other = 0;
  for (var i2 = 0; i2 < d.rows.length; i2++) {
    if (!isDone(selKey, i2)) continue;
    var rr = d.rows[i2];
    if (rr.cat === "tech") techMin += rr.min || 0;
    else if (rr.cat === "eng") engMin += rr.min || 0;
    else if (rr.min) other += rr.min;
  }
  html += '<div class="today-sum"><span>今日已完成：<b>' + fmt(techMin + engMin) + '</b> 学习（技术 ' + fmt(techMin) + ' · 英语 ' + fmt(engMin) + '）</span><span>其他（三餐/笛子/健身/休息）<b>' + fmt(other) + '</b></span></div>';
  if (d.line) html += '<div class="line-box"><b>✅ 今日达标线：</b>' + esc(d.line) + '</div>';
  el.innerHTML = html;
  var tasks = el.querySelectorAll(".task[data-i]");
  for (var t = 0; t < tasks.length; t++) {
    (function(node){
      node.querySelector(".cb").addEventListener("click", function(){ toggle(selKey, +node.getAttribute("data-i")); });
    })(tasks[t]);
  }
  var wbs = el.querySelectorAll(".wt-btns button");
  for (var b = 0; b < wbs.length; b++) {
    (function(node){
      node.addEventListener("click", function(){ setWt(byKey(selKey).week, node.getAttribute("data-wt")); });
    })(wbs[b]);
  }
}

function renderCal(){
  var el = document.getElementById("cal");
  var html = "";
  for (var i = 0; i < SCHEDULE.length; i++) {
    var d = SCHEDULE[i], st = dayStat(d.date);
    var cls = "cell";
    if (st.full) cls += " done"; else if (st.done > 0) cls += " part";
    if (d.date === todayKey()) cls += " today";
    if (d.date === selKey) cls += " sel";
    html += '<div class="' + cls + '" data-k="' + d.date + '" title="' + esc(d.label) + '">' + (i + 1) + (d.exam ? '<span class="st">★</span>' : '') + '</div>';
  }
  el.innerHTML = html;
  var cells = el.querySelectorAll(".cell");
  for (var c = 0; c < cells.length; c++) {
    (function(node){
      node.addEventListener("click", function(){ selKey = node.getAttribute("data-k"); render(); });
    })(cells[c]);
  }
}

function renderStats(){
  var s = computeStats();
  document.getElementById("stStreak").textContent = s.streak;
  document.getElementById("stTotal").textContent = s.total + "/81";
  document.getElementById("stTech").textContent = (s.tech / 60).toFixed(1) + "h";
  document.getElementById("stEng").textContent = (s.eng / 60).toFixed(1) + "h";
  var idx = dayIdx(todayKey()) + 1;
  document.getElementById("barLab").textContent = "第 " + idx + " 天 / 共 81 天";
  document.getElementById("barLeft").textContent = idx >= 81 ? "已到收官日" : ("还剩 " + (81 - idx) + " 天");
  document.getElementById("barFill").style.width = (idx / 81 * 100).toFixed(1) + "%";
}

function render(){ renderStats(); renderDay(); renderCal(); renderPlanVer(); }

function renderPlanVer(){
  var v = PLAN_VERSION || {};
  document.getElementById("pvTag").textContent = "v" + (v.v || 1);
  document.getElementById("pvAt").textContent = v.at ? ("规划师最后调整：" + v.at) : "";
  document.getElementById("pvNote").textContent = v.note || "";
}

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

document.getElementById("btnTheme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  try { localStorage.setItem(KEY + "_theme", cur === "dark" ? "light" : "dark"); } catch(e){}
});
try {
  var th = localStorage.getItem(KEY + "_theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
} catch(e){}

document.getElementById("btnCopy").addEventListener("click", function(){
  var d = byKey(selKey), st = dayStat(selKey);
  var lines = ["【学习日记 · " + d.label + "】", "本周目标：" + (d.goal || "—"), ""];
  for (var i = 0; i < d.rows.length; i++) {
    var r = d.rows[i];
    if (r.cat === "info") continue;
    lines.push((isDone(selKey, i) ? "[x] " : "[ ] ") + r.t + " " + r.name + (r.min ? "（" + fmt(r.min) + "）" : ""));
  }
  lines.push("", "完成度：" + st.done + "/" + st.total + (d.line ? "；达标线：" + d.line : ""));
  if (d.wt) {
    var wr2 = wtResult(d.week);
    lines.push("本周测试（" + d.week + "）：" + (wr2 === "pass" ? "已过" : (wr2 === "fail" ? "待补考" : "未测")) + "｜" + d.wt);
  }
  var txt = lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast("已复制，去日记窗口粘贴"); }, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
});
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("已复制，去日记窗口粘贴"); } catch(e){ toast("复制失败，请手动选择"); }
  document.body.removeChild(ta);
}
document.getElementById("btnExport").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(data)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "15周打卡备份_v" + ((PLAN_VERSION && PLAN_VERSION.v) || 1) + "_" + key(new Date()) + ".json";
  a.click();
  toast("已导出备份（存到 outputs/学习日记/ 防丢）");
});
document.getElementById("btnImport").addEventListener("click", function(){ document.getElementById("fileImp").click(); });
document.getElementById("fileImp").addEventListener("change", function(ev){
  var f = ev.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var d = JSON.parse(rd.result);
      if (d && d.done) { data = d; save(); render(); toast("导入成功"); }
      else toast("文件格式不对");
    } catch(e){ toast("导入失败：不是有效 JSON"); }
  };
  rd.readAsText(f);
});

render();
